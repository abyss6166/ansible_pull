---

- name: check if i3 config file exists
  tags: i3
  stat:
    path: /home/{{ user }}/.config/i3/config
  register: i3config

- name: back up i3 config file
  tags: i3
  copy:
    src: /home/{{ user }}/.config/i3/config
    dest: /home/{{ user }}/.config/i3/config.bak
  when: i3config.stat.exists

- name: check if picom config file exists
  tags: picom
  stat:
    path: /home/{{ user }}/.config/picom/picom.conf
  register: picomconfig

- name: back up picom.conf file
  tags: picom,i3
  copy:
    src: /home/{{ user }}/.config/picom/picom.conf
    dest: /home/{{ user }}/.config/picom/picom.conf.bak
    owner: "{{ user }}"
    group: "{{ user }}"
  when: picomconfig.stat.exists


- name: Install compositor and desktop component configurations
  tags: ["{{ item.tag }}", desktop]
  copy:
    src: "files/{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: "{{ item.mode | default('0644') }}"
    backup: true
  loop:
    - { src: "picom.conf", dest: "/home/{{ user }}/.config/picom/picom.conf", tag: "picom" }
    - { src: "config_poly", dest: "/home/{{ user }}/.config/i3/config", tag: "i3" }
    - { src: "config-color.ini", dest: "/home/{{ user }}/.config/polybar/config.ini", tag: "polybar" }
    - { src: "launch-newpolybar.sh", dest: "/home/{{ user }}/.config/polybar/launch.sh", tag: "polybar", mode: "0755" }
    - { src: "config.rasi", dest: "/home/{{ user }}/.config/rofi/config.rasi", tag: "rofi" }
    - { src: "tilix.dconf", dest: "/home/{{ user }}/tilix.dconf", tag: "tilix" }
    - { src: "Xresources", dest: "/home/{{ user }}/.Xresources", tag: "xresources" }
  notify: "{{ item.notify | default(omit) }}"

- name: wallpaper
  copy:
    src: files/arch.png
    dest: /usr/share/wallpapers/
    owner: "{{ user }}"
    group: "{{ user }}"

