---

- name: install packages
  tags: base
  pacman:
    name: '{{item}}'
  loop:
      # Desktop environment
      - xorg
      - lightdm
      - lightdm-gtk-greeter
      - lightdm-gtk-greeter-settings
      - i3-wm
      - i3status
      - i3blocks
      - i3lock
      - picom
      - polybar

      # Base packages
      - linux-headers
      - dmenu
      - rofi
      - nano
      - base-devel
      - pacman-contrib
      - intel-ucode
      - virtualbox-guest-utils
      - go
      - sysstat
      - python-psutil
      - fuse2
      - python-pip
      - python-pexpect
      - inetutils
      - numlockx
      - python-passlib
      - git-delta
      - plocate

      # Terminal/Shell
      - ttf-nerd-fonts-symbols
      - awesome-terminal-fonts
      - ttf-dejavu
      - otf-font-awesome
      - ttf-font-awesome
      - ttf-jetbrains-mono-nerd
      - ttf-iosevkaterm-nerd
      - ttf-iosevka-nerd
      - ttc-iosevka-ss08

      # Applications
      - pcmanfm
      - nitrogen
      - code
      - caja
      - discord
      - ark
      - dolphin
      - fastfetch
      - xsel
      - eza
      - nemo
      - dunst

      # Services
      - xdg-utils
      - xdg-user-dirs
      - unzip
      - curl
      - wget
      - dconf
      - pulseaudio
      - pulseaudio-alsa
      - pavucontrol
      - alsa-utils

      # Appearance
      - lxappearance
      - arc-icon-theme
      - breeze-icons
      - obsidian-icon-theme
      # - arc-theme
  # state: latest