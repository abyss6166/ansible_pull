---

- name: Configure git global settings
  tags: [git, config]
  git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: global
  become_user: "{{ user }}"
  loop:
    - { name: "user.email", value: "abyss616@yahoo.com" }
    - { name: "user.name", value: "Matt Horne" }
    - { name: "init.defaultBranch", value: "main" }
    - { name: "pull.rebase", value: "false" }
    - { name: "core.autocrlf", value: "input" }

- name: Configure git safe directories
  tags: [git, security]
  git_config:
    name: "safe.directory"
    value: "/home/{{ user }}/{{ item }}"
    scope: global
  become_user: "{{ user }}"
  loop:
    - git
    - git/polybar
    - git/yay

- name: Clone polybar scripts repository
  tags: [polybar, git]
  git:
    repo: https://github.com/polybar/polybar-scripts.git
    dest: "/home/{{ user }}/git/polybar"
    clone: true
    update: true
    force: true
    version: HEAD
  become_user: "{{ user }}"
  register: polybar_clone
  retries: 3
  delay: 5
  until: polybar_clone is succeeded


- name: install pacman-updates script
  tags: pacman
  copy:
    src: files/updates-pacman-sh
    dest: /home/{{ user }}/git/polybar/polybar-scripts/updates-pacman/updates-pacman.sh
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: '0755'
    backup: yes

- name: change polybar scripts permissions
  tags: polybar
  file:
    path: /home/{{ user }}/git/polybar
    state: directory
    recurse: yes
    owner: "{{ user }}"
    group: "{{ user }}"

- name: change pacman-updates script to executable
  command: "chmod +x /home/{{ user }}/git/polybar/polybar-scripts/updates-pacman/updates-pacman.sh"

- name: Clone yay
  become_user: "{{ user }}"
  become_method: su
  git:
    repo: https://aur.archlinux.org/yay-bin.git
    dest: /home/{{ user }}/git/yay
    update: true

- name: Build and install yay
  become_user: "{{ user }}"
  command:
    chdir: /home/{{ user }}/git/yay
    cmd: "makepkg -sfi --noconfirm"
    creates: /usr/bin/yay

